<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Pixel Summer Games</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100dvh;
      }
      #screen {
        display: block;
        /* Keep pixels sharp when the browser scales the canvas. */
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
    </style>
  </head>
  <body>
    <canvas id="screen" aria-label="Pixel Summer Games"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
