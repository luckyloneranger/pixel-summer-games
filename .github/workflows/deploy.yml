# On every push to main:
#  1. deploys the online room server to Cloudflare (only if the CLOUDFLARE_API_TOKEN
#     and CLOUDFLARE_ACCOUNT_ID repository secrets exist), then
#  2. builds the game (pointing online play at that server) and publishes it to GitHub Pages.
# One-time setup: Settings > Pages > Source: "GitHub Actions"; for online play, add the two secrets.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    outputs:
      rooms_url: ${{ steps.url.outputs.rooms_url }}
    steps:
      - uses: actions/checkout@v7
        if: env.HAS_TOKEN == 'true'
      - uses: actions/setup-node@v7
        if: env.HAS_TOKEN == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: env.HAS_TOKEN == 'true'
      - run: npm run typecheck:server
        if: env.HAS_TOKEN == 'true'
      - id: deploy
        if: env.HAS_TOKEN == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config server/wrangler.jsonc
      - id: url
        if: env.HAS_TOKEN == 'true'
        # The game talks to the server over secure WebSockets (wss://).
        run: echo "rooms_url=$(echo '${{ steps.deploy.outputs.deployment-url }}' | sed 's#^https://#wss://#')" >> "$GITHUB_OUTPUT"
      - if: env.HAS_TOKEN != 'true'
        run: echo "No Cloudflare secrets yet - skipping the room server (online play will be unavailable)."

  build:
    needs: server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_ROOMS_URL: ${{ needs.server.outputs.rooms_url || vars.ROOMS_URL }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
